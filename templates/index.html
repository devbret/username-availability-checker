<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Username Availability Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <h1>Username Availability Checker</h1>

        <form id="username-form" novalidate>
          <div class="search">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter a username…"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-describedby="username-help"
            />
          </div>
          <button type="submit" class="btn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Check</span>
          </button>
          <div class="history">
            <select id="all-previous-usernames"></select>
          </div>
        </form>
        <p id="username-help" class="field-help" aria-live="polite"></p>
      </div>
    </header>

    <main>
      <div class="container">
        <section id="results-summary" class="summary" hidden>
          <div class="summary-head">
            <p id="username-display"></p>
            <p class="summary-count" id="summary-count"></p>
          </div>
          <div class="progress">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div
            class="filters"
            id="filters"
            role="group"
            aria-label="Filter results by status"
          ></div>
        </section>
      </div>

      <section
        id="results-grid"
        class="grid"
        aria-live="polite"
        aria-busy="false"
      ></section>

      <div class="container">
        <div id="empty-state" class="empty" hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <h2>No searches yet</h2>
          <p>Enter a username above to check its availability.</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="container"></div>
    </footer>

    <div id="toast-container" class="toasts" aria-live="assertive"></div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
